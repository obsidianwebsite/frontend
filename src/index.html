<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Obsidian Trust Bancorp | Digital Banking, Institutional Treasury &amp; Wealth</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Obsidian Trust Bancorp Plc provides institutional commercial banking, corporate treasury facilities, high-yield deposit custody, global wire clearing, and wealth management services.">
  <meta name="copyright" content="Obsidian Trust Bancorp Plc">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#003432">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Obsidian Trust Bancorp">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Obsidian Trust Bancorp">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#f9f9f9] text-[#4d4e4f] font-sans antialiased selection:bg-[#0BB4D2] selection:text-white overscroll-none">
  <app-root>
    <!-- Institutional Sovereign Vault Preloader (Active while Angular bundle bootstraps) -->
    <div id="otb-bootstrap-preloader" style="position: fixed; inset: 0; z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #003432 0%, #001918 100%); font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif; color: #ffffff; user-select: none;">
      
      <div style="position: relative; width: 92px; height: 92px; margin-bottom: 24px; display: flex; align-items: center; justify-content: center;">
        <!-- Concentric Pulsing Halo Rings -->
        <div style="position: absolute; inset: -14px; border-radius: 50%; border: 2px solid rgba(11, 180, 210, 0.22); animation: otbPulse 2.4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;"></div>
        <div style="position: absolute; inset: -5px; border-radius: 50%; border: 2px dashed rgba(16, 185, 129, 0.45); animation: otbSpin 10s linear infinite;"></div>
        
        <!-- Vault Shield Emblem -->
        <div style="width: 76px; height: 76px; border-radius: 22px; background: linear-gradient(135deg, #004d49, #002221); border: 2px solid #0BB4D2; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6), 0 0 25px rgba(11, 180, 210, 0.4);">
          <svg style="width: 40px; height: 40px; color: #0BB4D2;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M12 8v4"/>
            <path d="M12 16h.01"/>
          </svg>
        </div>
      </div>

      <!-- Identity -->
      <div style="text-align: center; margin-bottom: 22px;">
        <div style="font-size: 21px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; color: #ffffff; text-shadow: 0 2px 10px rgba(0,0,0,0.5);">
          Obsidian Trust Bancorp
        </div>
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #0BB4D2; margin-top: 5px; opacity: 0.95;">
          Institutional Treasury &bull; Digital Vault
        </div>
      </div>

      <!-- Progress Track -->
      <div style="width: 210px; height: 4px; background: rgba(255, 255, 255, 0.08); border-radius: 9999px; overflow: hidden; position: relative;">
        <div style="position: absolute; top: 0; left: 0; bottom: 0; width: 45%; background: linear-gradient(90deg, transparent, #0BB4D2, #10b981, transparent); border-radius: 9999px; animation: otbBar 1.3s ease-in-out infinite;"></div>
      </div>

      <!-- Protocol Badge -->
      <div style="display: flex; align-items: center; gap: 7px; margin-top: 20px; font-size: 10px; font-weight: 700; color: rgba(255, 255, 255, 0.5); letter-spacing: 0.09em; text-transform: uppercase;">
        <span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981;"></span>
        <span>256-Bit Encrypted &bull; FDIC Insured Node</span>
      </div>
    </div>

    <style>
      @keyframes otbPulse {
        0% { transform: scale(0.92); opacity: 0.85; }
        50% { transform: scale(1.15); opacity: 0.15; }
        100% { transform: scale(0.92); opacity: 0.85; }
      }
      @keyframes otbSpin {
        100% { transform: rotate(360deg); }
      }
      @keyframes otbBar {
        0% { left: -45%; }
        100% { left: 100%; }
      }
    </style>
  </app-root>
</body>
</html>
