<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Obsidian Trust Bancorp Plc provides institutional commercial banking, corporate treasury facilities, high-yield deposit custody, global wire clearing, and wealth management services.">
  <meta name="copyright" content="Obsidian Trust Bancorp Plc">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#003432">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Obsidian Trust Bancorp">

<body class="bg-[#f9f9f9] text-[#4d4e4f] font-sans antialiased selection:bg-[#0BB4D2] selection:text-white overscroll-none">
  <app-root>
    <!-- Institutional Banking Preloader (Clean, Professional & Human-Designed) -->
    <div id="otb-bootstrap-preloader" style="position: fixed; inset: 0; z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #ffffff; font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none;">
      
      <!-- Clean Corporate Monogram -->
      <div style="width: 52px; height: 52px; border-radius: 14px; background-color: #003432; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(0, 52, 50, 0.12);">
        <span style="color: #ffffff; font-size: 18px; font-weight: 900; letter-spacing: -0.01em;">OTB</span>
      </div>

      <!-- Bank Name -->
      <div style="font-size: 15px; font-weight: 800; color: #003432; letter-spacing: -0.01em; margin-bottom: 18px; text-align: center;">
        Obsidian Trust Bancorp
      </div>

      <!-- Refined Corporate Spinner -->
      <div style="width: 22px; height: 22px; border: 2.5px solid #e2e8f0; border-top-color: #003432; border-radius: 50%; animation: otbSpin 0.75s linear infinite;"></div>

    </div>

    <style>
      @keyframes otbSpin {
        to { transform: rotate(360deg); }
      }
    </style>
  </app-root>
